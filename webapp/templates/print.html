<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print {{ title }}</title><link rel="stylesheet" href="/static/style.css"><script src="/static/print.js" defer></script></head>
<body class="print-page"><div class="actions"><h2>{{ title }}</h2><button class="primary" id="print">Print marker</button></div><p class="inline-help">Use 100% / actual size. The generated image is 160 mm wide including its white border; a marker generated here has a 120 mm black square. Do not crop the border. Imported images may have different proportions. Detection in this mission does not estimate metric distance.</p><img class="print-marker" src="{{ url_for('file_download', path=path, inline=1) }}" alt="{{ title }}"></body></html>
